[workspace]
resolver = "2"
members = ["crates/proxy-core", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.9.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = "12"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
