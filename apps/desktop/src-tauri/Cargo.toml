[package]
name = "proxydesk"
description = "ProxyDesk — desktop per-app / per-domain routing to Mudfish SOCKS5 via sing-box"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# `_lib` suffix avoids a name clash between the lib and bin on Windows (cargo#8519)
name = "proxydesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = { version = "3", features = ["windows-native"] }
log = "0.4.34"
proxy-core = { path = "../../../crates/proxy-core" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "query"] }
serde.workspace = true
serde_json.workspace = true
sysinfo = "0.39.6"
tauri = { version = "2.12.1", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-opener = "2.7.0"
tauri-plugin-single-instance = "2.5.2"
thiserror.workspace = true
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "process", "time", "io-util", "sync", "net"] }
uuid = { version = "1.27.0", features = ["v4"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
